[package]
name = "era"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alloy-consensus.workspace = true
alloy-primitives.workspace = true
alloy-rlp = "0.3"
eyre.workspace = true
futures.workspace = true
filter.workspace = true
model.workspace = true
serde.workspace = true
# native-tls-alpn is what makes the TLS handshake offer h2. The http2
# feature alone builds the HTTP/2 frames but still speaks HTTP/1.1.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "native-tls-alpn", "http2"] }
snap = "1"
tokio.workspace = true
tracing.workspace = true
